[pytest]
addopts = --cov-config=.coveragerc --cov --cov-report html --cov-report term --cov-report xml --junitxml=test-results.xml -vv -n auto --dist loadfile
pythonpath = .
python_files = test_*.py *_test.py *_integration.py
markers =
    serial: mark test to run serially (in single xdist group)
    xcvr_emu: uses a pytest-managed xcvr-emu subprocess and real SONiC EEPROM APIs
