# Shipped with sonic-cli-daemon (OPTIMIZE_CLI).
#
# show/main.py elects the routing stack (and so registers `show ip bgp ...`)
# with a one-shot `docker ps` probe at import time, which the warm daemon
# runs once. Whenever bgp.service starts -- feature enabled, `systemctl
# restart bgp`, auto-restart -- the container exists by now (created in the
# unit's ExecStartPre), so ask the daemon to re-import and re-run the probe.
# try-reload-or-restart is a no-op when the daemon is not running. bgp.service
# runs as User=admin, which may not reload units, so '+' runs this one command
# with full privileges; the leading '-' keeps a failure here from ever failing
# bgp.service.
[Service]
ExecStartPost=-+/bin/systemctl --no-block try-reload-or-restart sonic-cli-daemon.service
